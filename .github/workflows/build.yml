name: Build APK

on:
  push:
    branches: [main, "ccr-**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build
        run: |
          set -o pipefail
          gradle :core:test assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish failure log
        if: failure()
        run: |
          mkdir -p /tmp/log
          grep -nE "^e: |error:|FAILURE|FAILED|What went wrong|Caused by|expected:" -A6 build.log | head -800 > /tmp/log/errors.txt || true
          tail -400 build.log > /tmp/log/tail.txt || true
          for f in core/build/test-results/test/*.xml; do [ -f "$f" ] && cp "$f" /tmp/log/; done
          cd /tmp/log
          git init -q && git checkout -q -b ci-logs
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Build ${{ github.run_number }} log (${{ github.ref_name }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Rename APKs
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "dist/NovaFork-${{ github.run_number }}-$abi.apk"
          done
          ls -la dist

      # Branch builds are kept as workflow artifacts; only main publishes a release.
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: NovaFork-${{ github.run_number }}
          path: dist/*.apk

      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Nova Fork build ${{ github.run_number }}
          body: |
            Most phones and tablets: **arm64-v8a**. Older 32-bit phones: armeabi-v7a. Emulators and Chromebooks: x86_64.
          files: dist/*.apk

  # Renders the phone and tablet UI with Robolectric and publishes the PNGs to the "screens" branch.
  screens:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Render screens
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Publish screens
        if: always()
        run: |
          mkdir -p /tmp/out
          cp app/build/screens/*.png /tmp/out/ 2>/dev/null || true
          grep -nE "^e: |error:|FAILED|What went wrong|Caused by|Exception|expected" -A8 test.log | head -800 > /tmp/out/test-errors.txt || true
          tail -300 test.log > /tmp/out/test-tail.txt || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do [ -f "$f" ] && cp "$f" /tmp/out/; done
          cd /tmp/out
          git init -q && git checkout -q -b screens
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Screens ${{ github.run_number }} (${{ github.ref_name }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screens
